name: Build and publish Docker image

# Builds the image from the Dockerfile and pushes it to the GitHub Container
# Registry (ghcr.io) — no Docker Hub account needed. A push to master
# publishes/updates the ":latest" tag; a version tag (e.g. "v1.2.0") also
# publishes matching semver tags, so a specific release can be pinned.
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to ghcr.io under this repository's namespace.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags/labels from the git ref: "latest" + branch name on a
      # push to master, semver tags (1.2.0, 1.2, 1) on a "vX.Y.Z" git tag.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A git tag and a GitHub release are different objects: pushing the tag builds
  # the image but leaves the Releases page empty unless someone remembers to
  # create one by hand. Nobody did between 0.5.0 and 0.8.0, so it is automated
  # here. Runs only on a version tag, and only after the image is published, so
  # a release never announces an image that failed to build.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      # Creating a release writes to the repository's contents.
      contents: write

    steps:
      - name: Checkout
        # Full history: the annotated tag's message is the release body, and a
        # shallow clone would not carry it.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag message becomes the release notes, so it is written to a file and
      # passed by env/--notes-file rather than interpolated into the shell: a tag
      # message is arbitrary text, and pasting it into a command is how quotes and
      # backticks turn into executed code.
      - name: Build release notes from the annotated tag
        run: |
          set -eu
          TAG="$GITHUB_REF_NAME"
          # First line of the tag message is the subject, the rest the body.
          SOGGETTO=$(git tag -l --format='%(contents:subject)' "$TAG")
          git tag -l --format='%(contents:body)' "$TAG" > note.md
          if [ -n "$SOGGETTO" ]; then
            echo "RELEASE_TITLE=$TAG — $SOGGETTO" >> "$GITHUB_ENV"
          else
            # On a lightweight tag git falls back to the commit subject, so this
            # only catches the case where even that is empty.
            echo "RELEASE_TITLE=$TAG" >> "$GITHUB_ENV"
          fi
          {
            echo
            echo '## Immagine Docker'
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}"
            echo '```'
          } >> note.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file note.md \
            --generate-notes

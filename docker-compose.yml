services:
  scadenziario:
    # "image" is the published GitHub Container Registry build: plain
    # "docker compose up" pulls it, no local build needed. "build" is only
    # used when explicitly asked for with "docker compose up --build" (e.g.
    # when developing from a clone of this repo) — Compose then builds from
    # the local Dockerfile and tags it as "image" instead of pulling.
    image: ghcr.io/wtrucci/scadenziario:latest
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Path inside the container; must match the "data" volume mount below.
      DATABASE_URL: sqlite:///./data/scadenziario.db
    volumes:
      # Bind mount, not a named volume: the SQLite file lands in ./data next
      # to this docker-compose.yml, in plain sight for backup/inspection.
      - ./data:/app/data

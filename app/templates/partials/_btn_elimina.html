{# Delete action as an icon (bin), used in every data table's actions column.
   The row is deleted in place via HTMX, so the caller says which row.
   Context: url (DELETE endpoint), target (CSS selector of the row),
   conferma (text of the confirmation dialog). #}
<button type="button" class="icon-btn icon-btn-danger"
    title="Elimina" aria-label="Elimina"
    hx-delete="{{ url }}"
    hx-target="{{ target }}"
    hx-swap="outerHTML"
    hx-confirm="{{ conferma }}">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
</button>

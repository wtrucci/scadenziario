[alembic]
script_location = alembic

# Migration file naming: YYYYMMDD_<rev>_<slug>.py  (e.g. 20240115_abc123_initial_schema.py)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally left empty here.
# It is set at runtime in alembic/env.py by reading the DATABASE_URL environment variable.
sqlalchemy.url =

# Timezone used in migration file timestamps
timezone = Europe/Rome

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
